name: Foundry UVTT AD v14

permissions:
  contents: write # Add this
on:
  push:
    tags:
      - "*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to use for release"
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Zip output
        run: |
          mkdir dd-import-ad-v14
          cp *.* ./dd-import-ad-v14/
          zip -r dd-import-ad-v14.zip dd-import-ad-v14

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Handle both trigger types, github.event.inputs.tag is for getting the tag manual. If not found the automatic tag retrieval is used.
          # input events are only available for manual events aka workflow_dispatch events.
          tag="${{ github.event.inputs.tag || github.ref_name }}"

          gh release create "$tag" \
            --title="Release $tag" \
            --draft \
            module.json dd-import-ad-v14.zip
